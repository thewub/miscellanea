# Optional: for the authenticated Save Page Now API, add two repository secrets
# (Settings → Secrets and variables → Actions):
#   IA_ACCESS_KEY  and  IA_SECRET_KEY   (get them from https://archive.org/account/s3.php)
# Without them it falls back to the anonymous https://web.archive.org/save/<url> endpoint.

name: Save pages to Wayback Machine

on:
  schedule:
    - cron: "5 10 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  save:
    runs-on: ubuntu-latest
    env:
      URLS: |
        https://diamondgeezer.blogspot.com/
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - name: Request captures
        run: |
          set -u
          failed=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "Saving $url"
            if [ -n "$IA_ACCESS_KEY" ] && [ -n "$IA_SECRET_KEY" ]; then
              # Authenticated SPN2: returns JSON with a job_id
              resp=$(curl -sS --max-time 120 -X POST \
                -H "Accept: application/json" \
                -H "Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}" \
                --data-urlencode "url=${url}" \
                --data "skip_first_archive=1" \
                https://web.archive.org/save) || { echo "  request failed"; failed=1; continue; }
              echo "  $resp"
              echo "$resp" | grep -q '"job_id"' || failed=1
            else
              # Anonymous fallback
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 180 \
                "https://web.archive.org/save/${url}") || code=000
              echo "  HTTP $code"
              [ "$code" = "200" ] || failed=1
            fi
            sleep 20   # stay well under the Archive's rate limits
          done <<< "$URLS"
          exit $failed
